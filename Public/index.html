<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - Uzaktan Masaüstü & Yayın</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 1100px; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* Genel Bileşenler */
        .input-group { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        input[type="text"] { padding: 12px 16px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; outline: none; width: 100%; max-width: 350px; }
        button { padding: 12px 20px; border-radius: 6px; border: none; background: #3b82f6; color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .btn-danger { background: #ef4444 !important; }
        .btn-danger:hover { background: #dc2626 !important; }

        /* Login Ekranı */
        #login-screen { text-align: center; padding: 40px 20px; }

        /* Ana Lobi Paneli */
        #lobby-panel { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #334155; color: #94a3b8; }
        .tab-btn.active { background: #3b82f6; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Yayın Kartları */
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .room-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
        .room-card h3 { font-size: 18px; margin-bottom: 6px; color: #38bdf8; }
        .room-card p { font-size: 14px; color: #94a3b8; margin-bottom: 15px; }

        /* Aktif Yayın ve Kontrol Ekranı (Lobi Gizlenir) */
        #active-stream-screen { display: none; }
        .stream-layout { display: grid; grid-template-columns: 3fr 1fr; gap: 15px; }
        .video-wrapper { position: relative; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; max-height: 70vh; display: block; }
        
        .stream-controls { margin-top: 15px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }

        /* İzleyici Listesi */
        .viewers-panel { background: #0f172a; border-radius: 8px; padding: 15px; border: 1px solid #334155; height: 100%; max-height: 70vh; overflow-y: auto; }
        .viewers-panel h4 { border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 10px; color: #38bdf8; }
        .viewer-list { list-style: none; }
        .viewer-item { padding: 6px 10px; background: #1e293b; margin-bottom: 5px; border-radius: 4px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. GİRİŞ EKRANI -->
        <div id="login-screen">
            <h1>StreamHub Giriş</h1>
            <p style="color: #94a3b8; margin-top: 8px;">Devam etmek için bir kullanıcı adı girin</p>
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Kullanıcı Adınız...">
                <button id="loginBtn">Giriş Yap</button>
            </div>
        </div>

        <!-- 2. LOBİ PANELİ (Yayın Listesi & Yayın Açma Sekmeleri) -->
        <div id="lobby-panel">
            <div class="header">
                <h2>StreamHub - Lobi</h2>
                <span id="userBadge" style="background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 14px;"></span>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('list-tab', event)">Aktif Yayınlar</button>
                <button class="tab-btn" onclick="switchTab('host-tab', event)">Yayın Aç</button>
            </div>

            <!-- Yayınları Listele Sekmesi -->
            <div id="list-tab" class="tab-content active">
                <div class="room-grid" id="roomGrid">
                    <!-- Dinamik doldurulacak -->
                </div>
            </div>

            <!-- Yayın Aç Sekmesi -->
            <div id="host-tab" class="tab-content">
                <div class="input-group" style="justify-content: flex-start;">
                    <input type="text" id="roomNameInput" placeholder="Oda Adı Belirleyin...">
                    <button id="startHostBtn">Yayını Başlat</button>
                </div>
            </div>
        </div>

        <!-- 3. AKTİF YAYIN & İZLEME EKRANI (Lobi Tamamen Gizlenir) -->
        <div id="active-stream-screen">
            <div class="header">
                <h3 id="activeRoomTitle" style="color: #38bdf8;">Oda: -</h3>
                <button class="btn-danger" id="leaveStreamBtn">Yayından Ayrıl / Kapat</button>
            </div>

            <div class="stream-layout">
                <div>
                    <div class="video-wrapper">
                        <video id="remoteVideo" autoplay playsinline></video>
                    </div>
                    <div class="stream-controls">
                        <button id="fullscreenBtn">Tam Ekran Yap ⛶</button>
                        <span id="roleIndicator" style="color: #94a3b8; font-size: 14px;"></span>
                    </div>
                </div>

                <div class="viewers-panel">
                    <h4>Odadakiler (<span id="viewerCount">0</span>)</h4>
                    <ul class="viewer-list" id="viewerList">
                        <!-- İzleyiciler burada listelenecek -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let currentUser = "";
        let currentRoomId = "";
        let localStream = null;
        let peerConnection = null;
        let isHost = false;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // --- GİRİŞ İŞLEMİ ---
        document.getElementById('loginBtn').addEventListener('click', () => {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) return alert("Lütfen kullanıcı adı girin!");
            
            currentUser = username;
            document.getElementById('userBadge').innerText = `👤 ${currentUser}`;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('lobby-panel').style.display = 'block';
        });

        // --- SEKME GEÇİŞİ ---
        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // --- LOBİ ODA LİSTESİ ---
        socket.on('room-list', (rooms) => {
            const grid = document.getElementById('roomGrid');
            grid.innerHTML = "";

            if (rooms.length === 0) {
                grid.innerHTML = `<p style="color:#94a3b8;">Aktif yayın bulunmuyor.</p>`;
                return;
            }

            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.innerHTML = `
                    <div>
                        <h3>${room.id}</h3>
                        <p>Yayıncı: <b>${room.hostName}</b></p>
                        <p>İzleyici: ${room.viewerCount} Kişi</p>
                    </div>
                    <button onclick="joinStream('${room.id}')">Yayına Katıl</button>
                `;
                grid.appendChild(card);
            });
        });

        // --- HATA MESAJLARI ---
        socket.on('error-msg', (msg) => {
            alert(msg);
        });

        // --- YAYIN BAŞLATMA (HOST) ---
        document.getElementById('startHostBtn').addEventListener('click', async () => {
            const roomName = document.getElementById('roomNameInput').value.trim();
            if (!roomName) return alert("Lütfen oda adı girin!");

            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: false });
                
                isHost = true;
                currentRoomId = roomName;

                // Arayüzü değiştir
                document.getElementById('lobby-panel').style.display = 'none';
                document.getElementById('active-stream-screen').style.display = 'block';
                document.getElementById('activeRoomTitle').innerText = `Oda: ${roomName} (Yayıncı)`;
                document.getElementById('roleIndicator').innerText = "Yayın Yapılıyor";
                
                document.getElementById('remoteVideo').srcObject = localStream;

                // Akış durdurulursa (tarayıcı paylaşımı durdur butonuna basarsa)
                localStream.getVideoTracks()[0].onended = () => {
                    leaveStream();
                };

                socket.emit('create-room', { roomId: roomName, username: currentUser });

            } catch (err) {
                console.error(err);
                alert("Ekran paylaşımı izni verilmedi veya desteklenmiyor.");
            }
        });

        // --- YAYINA KATILMA (VIEWER) ---
        function joinStream(roomId) {
            isHost = false;
            currentRoomId = roomId;

            document.getElementById('lobby-panel').style.display = 'none';
            document.getElementById('active-stream-screen').style.display = 'block';
            document.getElementById('activeRoomTitle').innerText = `Oda: ${roomId} (İzleyici)`;
            document.getElementById('roleIndicator').innerText = "Canlı İzleniyor";

            socket.emit('join-room', { roomId, username: currentUser });
        }

        // --- İZLEYİCİ LİSTESİ GÜNCELLEME ---
        socket.on('update-viewers', (viewers) => {
            const list = document.getElementById('viewerList');
            document.getElementById('viewerCount').innerText = viewers.length;
            list.innerHTML = "";

            viewers.forEach(v => {
                const li = document.createElement('li');
                li.className = 'viewer-item';
                li.innerHTML = `<span class="status-dot"></span> ${v.username}`;
                list.appendChild(li);
            });
        });

        // --- WEBRTC GLOBAL SİNYAL VE BAĞLANTI YÖNETİMİ ---
        socket.on('user-connected', async (viewerId) => {
            if (!isHost) return;

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', { target: viewerId, signal: { candidate: event.candidate } });
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('signal', { target: viewerId, signal: { sdp: peerConnection.localDescription } });
        });

        socket.on('signal', async (data) => {
            if (!peerConnection) {
                peerConnection = new RTCPeerConnection(rtcConfig);
                
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        socket.emit('signal', { target: data.sender, signal: { candidate: event.candidate } });
                    }
                };

                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };
            }

            if (data.signal.sdp) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                if (data.signal.sdp.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('signal', { target: data.sender, signal: { sdp: peerConnection.localDescription } });
                }
            } else if (data.signal.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        // --- YAYINI KAPAT / AYRIL FONKSİYONU ---
        document.getElementById('leaveStreamBtn').addEventListener('click', () => {
            leaveStream();
        });

        function leaveStream() {
            if (currentRoomId) {
                socket.emit('leave-room', { roomId: currentRoomId });
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            document.getElementById('remoteVideo').srcObject = null;
            currentRoomId = "";
            isHost = false;

            // Ekranları eski haline getir
            document.getElementById('active-stream-screen').style.display = 'none';
            document.getElementById('lobby-panel').style.display = 'block';
        }

        socket.on('room-closed', () => {
            alert("Yayıncı yayını sonlandırdı.");
            leaveStream();
        });

        // --- TAM EKRAN ÖZELLİĞİ ---
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const videoElem = document.getElementById('remoteVideo');
            if (videoElem.requestFullscreen) {
                videoElem.requestFullscreen();
            } else if (videoElem.webkitRequestFullscreen) {
                videoElem.webkitRequestFullscreen();
            } else if (videoElem.msRequestFullscreen) {
                videoElem.msRequestFullscreen();
            }
        });
    </script>
</body>
</html>
