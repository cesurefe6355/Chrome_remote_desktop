<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumoLive - Canlı Yayın & Ekran Paylaşımı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: #313338; color: #dbdee1; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 1150px; background: #2b2d31; border-radius: 12px; padding: 28px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); border: 1px solid #1f2023; }
        
        .input-group { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
        input[type="text"], select { padding: 12px 16px; border-radius: 8px; border: 1px solid transparent; background: #1e1f22; color: #dbdee1; font-size: 15px; outline: none; width: 100%; transition: 0.2s; }
        input[type="text"]:focus, select:focus { border-color: #5865F2; }
        
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #5865F2; color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #4752c4; }
        
        .btn-danger { background: #ed4245 !important; }
        .btn-danger:hover { background: #c03537 !important; }

        .btn-logout { background: #4e5058; font-size: 13px; padding: 6px 12px; }
        .btn-logout:hover { background: #6d6f78; }

        /* Lobi Paneli */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3f4147; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #f2f3f5; display: flex; align-items: center; gap: 10px; }
        
        .user-panel-info { display: flex; align-items: center; gap: 12px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #35363c; color: #949ba4; width: auto; font-weight: 500; }
        .tab-btn.active { background: #5865F2; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
        .room-card { background: #1e1f22; border: 1px solid #3f4147; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .room-card:hover { border-color: #5865F2; transform: translateY(-2px); }
        .room-card h3 { font-size: 18px; margin-bottom: 8px; color: #f2f3f5; }
        .room-card p { font-size: 14px; color: #949ba4; margin-bottom: 15px; }
        .room-card button { width: 100%; }

        .host-form-box { max-width: 500px; background: #1e1f22; padding: 24px; border-radius: 10px; border: 1px solid #3f4147; }

        /* Aktif Yayın Ekranı */
        #active-stream-screen { display: none; }
        .stream-layout { display: grid; grid-template-columns: 3fr 1fr; gap: 18px; }
        .video-wrapper { position: relative; background: #000; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #3f4147; }
        
        video { width: 100%; max-height: 70vh; display: block; object-fit: contain; image-rendering: high-quality; }
        
        .stream-controls { margin-top: 15px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
        .stream-controls button { width: auto; background: #4e5058; }
        .stream-controls button:hover { background: #6d6f78; }

        .viewers-panel { background: #1e1f22; border-radius: 10px; padding: 18px; border: 1px solid #3f4147; height: 100%; max-height: 70vh; overflow-y: auto; }
        .viewers-panel h4 { border-bottom: 1px solid #3f4147; padding-bottom: 10px; margin-bottom: 12px; color: #f2f3f5; font-size: 15px; }
        .viewer-list { list-style: none; }
        .viewer-item { padding: 10px 12px; background: #2b2d31; margin-bottom: 8px; border-radius: 6px; font-size: 14px; display: flex; align-items: center; justify-content: space-between; color: #f2f3f5; }
        .viewer-info { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 8px; height: 8px; background: #23a55a; border-radius: 50%; }

        label { font-size: 13px; font-weight: 600; color: #b5bac1; margin-top: 10px; display: block; }
        .brand-badge { color: #5865F2; font-weight: 700; }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOBİ PANELİ -->
        <div id="lobby-panel">
            <div class="header">
                <h2>🟢 Lumo<span class="brand-badge">Live</span> Odaları</h2>
                <div class="user-panel-info">
                    <span id="userBadge" style="background: #1e1f22; color: #23a55a; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid #3f4147;"></span>
                    <button class="btn-logout" onclick="handleLogout()">Çıkış Yap</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('list-tab', event)">Aktif Yayınlar</button>
                <button class="tab-btn" onclick="switchTab('host-tab', event)">Yayın Aç</button>
            </div>

            <div id="list-tab" class="tab-content active">
                <div class="room-grid" id="roomGrid"></div>
            </div>

            <div id="host-tab" class="tab-content">
                <div class="host-form-box">
                    <div class="input-group" style="margin-top: 0;">
                        <label>Yayın Oda Adı</label>
                        <input type="text" id="roomNameInput" placeholder="Örn: Oyun Gecesi / Kodlama">
                        
                        <label>Görüntü Kalitesi (Çözünürlük)</label>
                        <select id="resolutionSelect">
                            <option value="720">720p HD</option>
                            <option value="1080">1080p FHD (Önerilen)</option>
                            <option value="1440">1440p 2K QHD</option>
                            <option value="4k">4K Ultra HD</option>
                            <option value="max" selected>Maksimum / Orijinal Ekran</option>
                        </select>

                        <label>Yenileme Hızı (FPS)</label>
                        <select id="fpsSelect">
                            <option value="30">30 FPS</option>
                            <option value="60" selected>60 FPS (Akıcı)</option>
                            <option value="120">120 FPS (Yüksek)</option>
                            <option value="144">144 FPS (Ultra)</option>
                        </select>

                        <button id="startHostBtn" style="margin-top: 18px;">Yayını Başlat</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- AKTİF YAYIN EKRANI -->
        <div id="active-stream-screen">
            <div class="header">
                <h3 id="activeRoomTitle" style="color: #f2f3f5;">Oda: -</h3>
                <button class="btn-danger" id="leaveStreamBtn">Yayından Ayrıl</button>
            </div>

            <div class="stream-layout">
                <div>
                    <div class="video-wrapper">
                        <video id="remoteVideo" autoplay playsinline></video>
                    </div>
                    <div class="stream-controls">
                        <button id="fullscreenBtn">Tam Ekran ⛶</button>
                        <span id="roleIndicator" style="color: #949ba4; font-size: 14px; font-weight: 500;"></span>
                    </div>
                </div>

                <div class="viewers-panel">
                    <h4>İzleyiciler (<span id="viewerCount">0</span>)</h4>
                    <ul class="viewer-list" id="viewerList"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const currentUser = localStorage.getItem('lumolive_user');
        if (!currentUser) {
            window.location.href = '/login.html';
        } else {
            document.getElementById('userBadge').innerText = `● ${currentUser}`;
        }

        function handleLogout() {
            localStorage.removeItem('lumolive_user');
            window.location.href = '/login.html';
        }

        const socket = io();

        let currentRoomId = "";
        let localStream = null;
        let isHost = false;

        // Çoklu izleyici desteği için yayıncının bağlantılarını tutan harita
        const hostPCs = {};
        // İzleyicinin yayıncıdan gelen akışı almak için kullandığı bağlantı
        let viewPeerConnection = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        socket.on('room-list', (rooms) => {
            const grid = document.getElementById('roomGrid');
            grid.innerHTML = "";

            if (rooms.length === 0) {
                grid.innerHTML = `<p style="color:#949ba4;">Şu anda aktif bir LumoLive yayını bulunmuyor.</p>`;
                return;
            }

            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.innerHTML = `
                    <div>
                        <h3>${room.id}</h3>
                        <p>Yayıncı: <b>${room.hostName}</b></p>
                        <p>İzleyici: ${room.viewerCount} Kişi</p>
                    </div>
                    <button onclick="joinStream('${room.id}')">Yayına Katıl</button>
                `;
                grid.appendChild(card);
            });
        });

        socket.on('error-msg', (msg) => alert(msg));

        document.getElementById('startHostBtn').addEventListener('click', async () => {
            const roomName = document.getElementById('roomNameInput').value.trim();
            const resolution = document.getElementById('resolutionSelect').value;
            const fps = parseInt(document.getElementById('fpsSelect').value);
            
            if (!roomName) return alert("Lütfen oda adı gir!");

            let videoConstraints = { cursor: "always", frameRate: { ideal: fps, max: fps } };

            if (resolution === '720') {
                videoConstraints.width = { ideal: 1280 }; videoConstraints.height = { ideal: 720 };
            } else if (resolution === '1080') {
                videoConstraints.width = { ideal: 1920 }; videoConstraints.height = { ideal: 1080 };
            } else if (resolution === '1440') {
                videoConstraints.width = { ideal: 2560 }; videoConstraints.height = { ideal: 1440 };
            } else if (resolution === '4k') {
                videoConstraints.width = { ideal: 3840 }; videoConstraints.height = { ideal: 2160 };
            } else if (resolution === 'max') {
                videoConstraints.width = { max: 4096 }; videoConstraints.height = { max: 2160 };
            }

            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: videoConstraints, audio: false });
                
                isHost = true;
                currentRoomId = roomName;

                document.getElementById('lobby-panel').style.display = 'none';
                document.getElementById('active-stream-screen').style.display = 'block';
                document.getElementById('activeRoomTitle').innerText = `LumoLive Oda: ${roomName} (Yayıncısın)`;
                document.getElementById('roleIndicator').innerText = `Canlı Yayın (${resolution === 'max' ? 'Orijinal' : resolution + 'p'} - ${fps} FPS)`;
                
                document.getElementById('fullscreenBtn').style.display = 'none';
                document.getElementById('remoteVideo').srcObject = localStream;
                document.getElementById('remoteVideo').muted = true; // Yayıncı kendi sesini duymasın

                localStream.getVideoTracks()[0].onended = () => leaveStream();
                socket.emit('create-room', { roomId: roomName, username: currentUser });

            } catch (err) {
                console.error(err);
                alert("Ekran paylaşımı izni verilmedi.");
            }
        });

        function joinStream(roomId) {
            isHost = false;
            currentRoomId = roomId;

            document.getElementById('lobby-panel').style.display = 'none';
            document.getElementById('active-stream-screen').style.display = 'block';
            document.getElementById('activeRoomTitle').innerText = `LumoLive Oda: ${roomId}`;
            document.getElementById('roleIndicator').innerText = "Canlı İzleniyor";

            document.getElementById('fullscreenBtn').style.display = 'inline-block';
            socket.emit('join-room', { roomId, username: currentUser });
        }

        socket.on('update-viewers', (viewers) => {
            const list = document.getElementById('viewerList');
            document.getElementById('viewerCount').innerText = viewers.length;
            list.innerHTML = "";

            viewers.forEach(v => {
                const li = document.createElement('li');
                li.className = 'viewer-item';
                li.innerHTML = `
                    <div class="viewer-info">
                        <span class="status-dot"></span> 
                        <span>${v.username}</span>
                    </div>
                `;
                list.appendChild(li);
            });
        });

        // Yayıncı için yeni bir izleyici katıldığında tetiklenir
        socket.on('user-connected', async (viewerId) => {
            if (!isHost) return;

            if (hostPCs[viewerId]) hostPCs[viewerId].close();

            const pc = new RTCPeerConnection(rtcConfig);
            hostPCs[viewerId] = pc;

            localStream.getTracks().forEach(track => {
                const sender = pc.addTrack(track, localStream);
                if (track.kind === 'video') {
                    try {
                        const parameters = sender.getParameters();
                        if (!parameters.encodings) parameters.encodings = [{}];
                        parameters.encodings[0].maxBitrate = 25000000;
                        parameters.encodings[0].maxFramerate = parseInt(document.getElementById('fpsSelect').value);
                        sender.setParameters(parameters);
                    } catch (e) {}
                }
            });

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', { target: viewerId, signal: { candidate: event.candidate } });
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('signal', { target: viewerId, signal: { sdp: pc.localDescription } });
        });

        // Sinyalleşme ve veri alışverişi
        socket.on('signal', async (data) => {
            if (isHost) {
                // Yayıncının, izleyicilerden gelen sinyalleri işlemesi
                const pc = hostPCs[data.sender];
                if (!pc) return;

                if (data.signal.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                } else if (data.signal.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                }
            } else {
                // İzleyicinin, yayıncıdan gelen sinyalleri işlemesi
                if (!viewPeerConnection) {
                    viewPeerConnection = new RTCPeerConnection(rtcConfig);
                    
                    viewPeerConnection.onicecandidate = (event) => {
                        if (event.candidate) {
                            socket.emit('signal', { target: data.sender, signal: { candidate: event.candidate } });
                        }
                    };

                    viewPeerConnection.ontrack = (event) => {
                        const videoElem = document.getElementById('remoteVideo');
                        videoElem.srcObject = event.streams[0];
                        videoElem.muted = false;
                        videoElem.play().catch(() => {});
                    };
                }

                if (data.signal.sdp) {
                    await viewPeerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                    if (data.signal.sdp.type === 'offer') {
                        const answer = await viewPeerConnection.createAnswer();
                        await viewPeerConnection.setLocalDescription(answer);
                        socket.emit('signal', { target: data.sender, signal: { sdp: viewPeerConnection.localDescription } });
                    }
                } else if (data.signal.candidate) {
                    await viewPeerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                }
            }
        });

        document.getElementById('leaveStreamBtn').addEventListener('click', () => leaveStream());

        function leaveStream() {
            if (currentRoomId) socket.emit('leave-room', { roomId: currentRoomId });
            
            if (localStream) { 
                localStream.getTracks().forEach(t => t.stop()); 
                localStream = null; 
            }
            
            // Yayıncının tüm izleyici bağlantılarını kapatması
            Object.values(hostPCs).forEach(pc => pc.close());
            for (const key in hostPCs) delete hostPCs[key];

            // İzleyicinin bağlantısını kapatması
            if (viewPeerConnection) { 
                viewPeerConnection.close(); 
                viewPeerConnection = null; 
            }

            document.getElementById('remoteVideo').srcObject = null;
            currentRoomId = "";
            isHost = false;

            document.getElementById('active-stream-screen').style.display = 'none';
            document.getElementById('lobby-panel').style.display = 'block';
        }

        socket.on('room-closed', () => {
            alert("Yayın sona erdi! Yayıncı yayını kapattı.");
            leaveStream();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const videoElem = document.getElementById('remoteVideo');
            if (videoElem.requestFullscreen) videoElem.requestFullscreen();
            else if (videoElem.webkitRequestFullscreen) videoElem.webkitRequestFullscreen();
        });
    </script>
</body>
</html>
