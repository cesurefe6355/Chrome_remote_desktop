<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumoLive - Sesli Sohbet & Canlı Yayın</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: #313338; color: #dbdee1; height: 100vh; overflow: hidden; }
        
        .app-layout { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
        
        /* 1. SÜTUN: Sunucu Çubuğu */
        .server-sidebar { width: 72px; background-color: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; border-right: 1px solid #1f2023; z-index: 10; flex-shrink: 0; }
        .server-icon { width: 48px; height: 48px; border-radius: 50%; background: #313338; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .server-icon.active { border-radius: 16px; background: #5865F2; }

        /* 2. SÜTUN: Kanal Listesi & Kullanıcı Paneli */
        .channel-sidebar { width: 240px; background-color: #2b2d31; display: flex; flex-direction: column; border-right: 1px solid #1f2023; z-index: 5; flex-shrink: 0; }
        .server-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; color: #f2f3f5; border-bottom: 1px solid #1f2023; }
        .channels-list { flex: 1; padding: 16px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .channel-category { font-size: 12px; font-weight: 700; color: #949ba4; text-transform: uppercase; padding: 8px; display: flex; justify-content: space-between; align-items: center; }
        .add-channel-btn { cursor: pointer; font-size: 16px; color: #949ba4; }
        .add-channel-btn:hover { color: #f2f3f5; }
        
        .channel-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 4px; color: #949ba4; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.15s; }
        .channel-item:hover { background: #35363c; color: #dbdee1; }
        .channel-item.active { background: #404249; color: #f2f3f5; }
        .live-badge { background: #ed4245; color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }

        /* Sol Alt Profil ve Ses Kontrolleri */
        .user-profile { background: #232428; padding: 10px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1f2023; flex-shrink: 0; }
        .user-info-box { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .user-avatar { width: 32px; height: 32px; background: #5865F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; flex-shrink: 0; }
        .username-text { font-size: 14px; font-weight: 600; color: #f2f3f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .profile-actions { display: flex; gap: 2px; }
        .action-icon-btn { background: transparent; border: none; color: #949ba4; cursor: pointer; padding: 6px; border-radius: 4px; transition: 0.15s; font-size: 14px; }
        .action-icon-btn:hover { background: #35363c; color: #f2f3f5; }
        .action-icon-btn.off { color: #ed4245 !important; background: rgba(237, 66, 69, 0.15); }

        /* 3. SÜTUN: Ana İçerik Alanı */
        .main-content { flex: 1; background-color: #313338; display: flex; flex-direction: column; overflow: hidden; }
        .main-header-bar { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2023; }
        .channel-title { font-weight: 700; color: #f2f3f5; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        
        .main-body-area { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; }

        input[type="text"], select { padding: 10px 14px; border-radius: 6px; border: 1px solid transparent; background: #1e1f22; color: #dbdee1; font-size: 14px; outline: none; width: 100%; }
        button { padding: 10px 18px; border-radius: 6px; border: none; background: #5865F2; color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #4752c4; }

        .no-stream-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #949ba4; gap: 16px; text-align: center; }
        .no-stream-box h2 { color: #f2f3f5; font-size: 22px; }

        #active-stream-screen { display: none; height: 100%; flex-direction: column; }
        .stream-layout { display: grid; grid-template-columns: 1fr 260px; gap: 16px; height: calc(100vh - 100px); }
        .video-wrapper { position: relative; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #1f2023; height: 100%; }
        video { width: 100%; height: 100%; object-fit: contain; }

        .viewers-sidebar { background: #2b2d31; border-radius: 8px; padding: 14px; border: 1px solid #1f2023; height: 100%; overflow-y: auto; }
        .viewers-sidebar h4 { font-size: 13px; font-weight: 700; color: #949ba4; text-transform: uppercase; margin-bottom: 10px; }
        .member-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .member-item { padding: 8px 10px; background: #1e1f22; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #f2f3f5; }
        .status-dot { width: 8px; height: 8px; background: #23a55a; border-radius: 50%; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #313338; border: 1px solid #1f2023; border-radius: 12px; padding: 24px; width: 100%; max-width: 440px; }
    </style>
</head>
<body>

    <!-- GİZLİ SES ELEMENTLERİ KONTEYNERİ -->
    <div id="audioContainer" style="display: none;"></div>

    <!-- ODA OLUŞTURMA MODALI -->
    <div id="createChannelModal" class="modal-overlay">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="color:#fff;">Oda Oluştur</h3>
                <button onclick="closeModal('createChannelModal')" style="background: transparent; color: #949ba4; padding: 4px 8px;">✕</button>
            </div>
            <input type="text" id="newChannelNameInput" placeholder="Örn: Sohbet-Odasi">
            <button id="btnCreateChannelConfirm" style="margin-top: 16px; width: 100%;">Oluştur</button>
        </div>
    </div>

    <!-- YAYIN AYARLARI MODALI -->
    <div id="streamSetupModal" class="modal-overlay">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="color:#fff;">Ekran Yayını Aç</h3>
                <button onclick="closeModal('streamSetupModal')" style="background: transparent; color: #949ba4; padding: 4px 8px;">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="font-size: 12px; font-weight: 700; color: #b5bac1;">ÇÖZÜNÜRLÜK</label>
                    <select id="resolutionSelect" style="margin-top: 4px;">
                        <option value="720">720p HD</option>
                        <option value="1080" selected>1080p FHD</option>
                        <option value="1440">1440p 2K</option>
                        <option value="4k">4K Ultra HD</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: 700; color: #b5bac1;">YENİLEME HIZI (FPS)</label>
                    <select id="fpsSelect" style="margin-top: 4px;">
                        <option value="30">30 FPS</option>
                        <option value="60" selected>60 FPS</option>
                        <option value="120">120 FPS</option>
                    </select>
                </div>
                <button id="startHostBtn" style="margin-top: 12px; width: 100%;">Yayını Başlat</button>
            </div>
        </div>
    </div>

    <!-- UYARI MODALI -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-box" style="text-align: center;">
            <h3 id="modalTitle" style="color:#fff;">Bilgilendirme</h3>
            <p id="modalDesc" style="color: #949ba4; margin: 12px 0 20px 0; font-size: 14px;"></p>
            <button onclick="closeModal('customModal')" style="width: 100%;">Tamam</button>
        </div>
    </div>

    <div class="app-layout">
        <div class="server-sidebar">
            <div class="server-icon active">LL</div>
        </div>

        <div class="channel-sidebar">
            <div class="server-header">
                <span>LumoLive</span>
            </div>
            
            <div class="channels-list">
                <div class="channel-category">
                    <span>Odalar / Kanallar</span>
                    <span class="add-channel-btn" onclick="openModal('createChannelModal')">+</span>
                </div>
                <div id="channelContainer"></div>
            </div>

            <!-- Sol Alt Kullanıcı Profili ve Ses / Yayın Kontrolleri -->
            <div class="user-profile">
                <div class="user-info-box">
                    <div class="user-avatar" id="userAvatarIcon">U</div>
                    <div>
                        <div class="username-text" id="usernameDisplay">Kullanıcı</div>
                        <div style="font-size: 11px; color: #23a55a;">Ses Bağlandı</div>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="action-icon-btn" id="micToggleBtn" onclick="toggleMicrophone()" title="Mikrofon Aç/Kapat">🎙️</button>
                    <button class="action-icon-btn" id="deafenToggleBtn" onclick="toggleDeafen()" title="Gelen Sesleri Aç/Kapat">🎧</button>
                    <button class="action-icon-btn" id="streamToggleBtn" onclick="openModal('streamSetupModal')" title="Ekran Paylaş">📡</button>
                    <button class="action-icon-btn" onclick="handleLogout()" title="Çıkış Yap">⎋</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="main-header-bar">
                <div class="channel-title">
                    <span>#</span> <span id="currentRoomTitle">Oda Seçilmedi</span>
                </div>
            </div>

            <div class="main-body-area">
                <!-- Yayın Yokken -->
                <div id="noStreamView" class="no-stream-box">
                    <h2>Sesli sohbete bağlandınız! Odada henüz ekran yayını yok.</h2>
                    <p>Ekranınızı paylaşmak için aşağıdaki butona veya sol alttaki <b>📡</b> simgesine tıklayabilirsiniz.</p>
                    <button onclick="openModal('streamSetupModal')">Ekran Paylaşımı Başlat</button>
                </div>

                <!-- Yayın Ekranı -->
                <div id="active-stream-screen">
                    <div class="stream-layout">
                        <div>
                            <div class="video-wrapper">
                                <video id="remoteVideo" autoplay playsinline></video>
                            </div>
                            <div class="stream-bottom-bar" style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                                <button onclick="toggleFullscreen()">Tam Ekran ⛶</button>
                                <span id="roleIndicator" style="color: #949ba4; font-size: 14px;"></span>
                                <button id="stopStreamBtn" style="display:none; background:#ed4245;" onclick="stopStream()">Yayını Durdur</button>
                            </div>
                        </div>

                        <div class="viewers-sidebar">
                            <h4>Odadakiler (<span id="memberCount">0</span>)</h4>
                            <ul class="member-list" id="memberList"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const currentUser = localStorage.getItem('lumolive_user');
        if (!currentUser) window.location.href = '/login.html';
        else {
            document.getElementById('usernameDisplay').innerText = currentUser;
            document.getElementById('userAvatarIcon').innerText = currentUser.charAt(0).toUpperCase();
        }

        function handleLogout() {
            if (selectedRoomId) socket.emit('leave-room', { roomId: selectedRoomId });
            localStorage.removeItem('lumolive_user');
            window.location.href = '/login.html';
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            openModal('customModal');
        }

        const socket = io();
        let selectedRoomId = "";
        let localAudioStream = null;
        let localVideoStream = null;
        let isMicMuted = false;
        let isDeafened = false;
        let isHost = false;

        const voicePeerConnections = {}; // SocketID -> RTCPeerConnection (Sesli Sohbet için)
        let streamPeerConnection = null;  // Ekran Paylaşımı için

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // Tarayıcı Mikrofon Erişimi Başlatma
        async function initLocalAudio() {
            try {
                localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                console.warn("Mikrofon erişimi verilmedi veya mikrofon bulunamadı.");
            }
        }
        initLocalAudio();

        // 1. MİKROFON AÇ / KAPA
        function toggleMicrophone() {
            if (!localAudioStream) return showModal("Uyarı", "Mikrofon bulunamadı!");
            isMicMuted = !isMicMuted;
            localAudioStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);

            const btn = document.getElementById('micToggleBtn');
            if (isMicMuted) {
                btn.innerText = '🔇';
                btn.classList.add('off');
            } else {
                btn.innerText = '🎙️';
                btn.classList.remove('off');
            }
        }

        // 2. GELEN SESLERİ AÇ / KAPA (DEAFEN)
        function toggleDeafen() {
            isDeafened = !isDeafened;
            const audioElements = document.querySelectorAll('#audioContainer audio');
            audioElements.forEach(a => a.muted = isDeafened);

            const btn = document.getElementById('deafenToggleBtn');
            if (isDeafened) {
                btn.innerText = '🔇';
                btn.classList.add('off');
            } else {
                btn.innerText = '🎧';
                btn.classList.remove('off');
            }
        }

        // Oda Listesi Güncelleme
        socket.on('room-list-update', (rooms) => {
            const container = document.getElementById('channelContainer');
            container.innerHTML = "";

            rooms.forEach(room => {
                const item = document.createElement('div');
                item.className = `channel-item ${selectedRoomId === room.id ? 'active' : ''}`;
                item.onclick = () => selectRoom(room.id);

                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span>#</span> <span>${room.id}</span>
                    </div>
                    ${room.isLive ? `<span class="live-badge">CANLI</span>` : ''}
                `;
                container.appendChild(item);
            });

            if (!selectedRoomId && rooms.length > 0) {
                selectRoom(rooms[0].id);
            }
        });

        // Oda Seçme ve Sesli Sohbete Bağlanma
        function selectRoom(roomId) {
            if (selectedRoomId === roomId) return;

            // Eski odadaki ses bağlantılarını kapat
            Object.keys(voicePeerConnections).forEach(id => {
                voicePeerConnections[id].close();
                delete voicePeerConnections[id];
            });
            document.getElementById('audioContainer').innerHTML = "";

            if (selectedRoomId) socket.emit('leave-room', { roomId: selectedRoomId });

            selectedRoomId = roomId;
            document.getElementById('currentRoomTitle').innerText = roomId;

            socket.emit('join-room', { roomId, username: currentUser });

            document.querySelectorAll('.channel-item').forEach(el => {
                if (el.innerText.includes(roomId)) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        socket.on('room-joined', ({ roomId, isLive, hostName, members }) => {
            if (isLive) {
                document.getElementById('noStreamView').style.display = 'none';
                document.getElementById('active-stream-screen').style.display = 'flex';
                document.getElementById('roleIndicator').innerText = `Yayıncı: ${hostName}`;
            } else {
                document.getElementById('noStreamView').style.display = 'flex';
                document.getElementById('active-stream-screen').style.display = 'none';
            }
        });

        socket.on('update-room-members', (members) => {
            document.getElementById('memberCount').innerText = members.length;
            const list = document.getElementById('memberList');
            list.innerHTML = "";
            members.forEach(m => {
                const li = document.createElement('li');
                li.className = 'member-item';
                li.innerHTML = `<span class="status-dot"></span> <span>${m.username}</span>`;
                list.appendChild(li);
            });
        });

        // --- SESLİ SOHBET MESH WEBRTC BAĞLANTILARI ---
        socket.on('user-joined-voice', async ({ socketId }) => {
            if (!localAudioStream) return;
            const pc = createVoicePeerConnection(socketId);
            voicePeerConnections[socketId] = pc;

            localAudioStream.getTracks().forEach(track => pc.addTrack(track, localAudioStream));

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('signal', { target: socketId, signal: { sdp: pc.localDescription }, type: 'voice' });
        });

        socket.on('user-left-voice', (socketId) => {
            if (voicePeerConnections[socketId]) {
                voicePeerConnections[socketId].close();
                delete voicePeerConnections[socketId];
            }
            const audioElem = document.getElementById(`audio-${socketId}`);
            if (audioElem) audioElem.remove();
        });

        function createVoicePeerConnection(targetSocketId) {
            const pc = new RTCPeerConnection(rtcConfig);

            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { target: targetSocketId, signal: { candidate: e.candidate }, type: 'voice' });
            };

            pc.ontrack = (e) => {
                let audioElem = document.getElementById(`audio-${targetSocketId}`);
                if (!audioElem) {
                    audio
