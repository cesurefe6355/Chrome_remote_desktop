<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumoLive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'gg sans','Noto Sans','Helvetica Neue',Helvetica,Arial,sans-serif}
body{background:#313338;color:#dbdee1;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:4px}
svg{width:20px;height:20px;fill:currentColor;display:block}
.app{display:flex;height:100vh}
.rail{width:72px;background:#1e1f22;display:flex;flex-direction:column;align-items:center;padding-top:12px;flex-shrink:0}
.srv{width:48px;height:48px;border-radius:16px;background:#5865F2;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;position:relative}
.srv::before{content:"";position:absolute;left:-12px;width:4px;height:40px;background:#fff;border-radius:0 4px 4px 0}
.side{width:240px;background:#2b2d31;display:flex;flex-direction:column;flex-shrink:0}
.sh{height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;color:#f2f3f5;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.chs{flex:1;overflow-y:auto;padding:16px 8px}
.cat{display:flex;justify-content:space-between;align-items:center;padding:12px 8px 4px;font-size:12px;font-weight:700;color:#949ba4;text-transform:uppercase}
.cat button{background:none;color:#949ba4;font-size:18px;padding:0 4px}.cat button:hover{color:#f2f3f5;background:none}
.ch{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:1px 0;border-radius:4px;color:#949ba4;cursor:pointer;font-weight:500;font-size:15px}
.ch:hover{background:#35373c;color:#dbdee1}.ch.on{background:#404249;color:#fff}
.ch svg{width:18px;height:18px;flex-shrink:0;color:#80848e}.ch .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{background:#ed4245;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;animation:pulse 1.6s infinite}
.vu{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 30px;color:#949ba4;font-size:14px;border-radius:4px}.vu:hover{background:#35373c;color:#dbdee1}
.vu .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vu svg{width:16px;height:16px}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex-shrink:0;transition:box-shadow .12s}
.av.speak{box-shadow:0 0 0 2px #23a55a}
.av.big{width:80px;height:80px;font-size:32px}.av.big.speak{box-shadow:0 0 0 4px #23a55a}
.sl{position:relative;color:#f23f42;display:flex}.sl::after{content:"";position:absolute;left:-1px;right:-1px;top:50%;height:2px;background:#f23f42;transform:rotate(-45deg)}
.vstat{background:#232428;border-bottom:1px solid #1a1b1e;padding:8px 12px;display:none;align-items:center;justify-content:space-between}
.vstat b{color:#23a55a;font-size:14px;display:block}.vstat small{color:#949ba4;font-size:12px}
.panel{background:#232428;height:52px;padding:0 8px;display:flex;align-items:center;justify-content:space-between}
.me{display:flex;align-items:center;gap:8px;min-width:0;padding:4px}
.me .av{width:32px;height:32px;font-size:14px;position:relative}
.me .av::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;background:#23a55a;border-radius:50%;border:2px solid #232428}
.me b{display:block;font-size:14px;color:#f2f3f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{font-size:12px;color:#949ba4}
.ib{background:none;color:#b5bac1;padding:6px;border-radius:4px;position:relative}
.ib:hover{background:#35373c;color:#dbdee1;}
.ib.off{color:#f23f42}.ib.off::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;background:#f23f42;transform:rotate(-45deg)}
.ib:active{animation:pop .25s}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hd{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 0 rgba(0,0,0,.25);font-weight:700;color:#f2f3f5;flex-shrink:0}
.hd .t{display:flex;align-items:center;gap:8px}.hd .t svg{color:#80848e}
.body{flex:1;display:flex;min-height:0}
#textView{flex:1;display:flex;min-width:0;min-height:0}
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:16px 0}
.empty{padding:16px;color:#949ba4}.empty h2{color:#f2f3f5;font-size:24px;margin-bottom:6px}
.msg{display:flex;gap:16px;padding:4px 16px;margin-top:12px;position:relative;animation:fade .2s}.msg:hover{background:#2e3035}
.msg .av{width:40px;height:40px;font-size:16px}
.msg b{color:#f2f3f5;font-size:15px}.msg time{color:#949ba4;font-size:12px;margin-left:8px}
.msg p{white-space:pre-wrap;word-break:break-word;line-height:1.35;font-size:15px}
.inp{padding:0 16px 24px}.inp input{width:100%;padding:11px 16px;border-radius:8px;border:0;background:#383a40;color:#dbdee1;font-size:15px;outline:0}
.members{width:240px;background:#2b2d31;padding:24px 8px;overflow-y:auto;flex-shrink:0}
.members h4{font-size:12px;color:#949ba4;text-transform:uppercase;padding:0 8px 8px}
.mi{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:4px;color:#949ba4;font-weight:500}.mi:hover{background:#35373c;color:#dbdee1}
.mi .av{width:32px;height:32px;font-size:14px}
#voiceView{flex:1;display:none;flex-direction:column;min-width:0;min-height:0;background:#1e1f22}
#stage{display:none;background:#000;position:relative;height:55%;min-height:180px;flex-shrink:0}
#stage video{width:100%;height:100%;object-fit:contain}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:.2s}
#stage:hover .bar{opacity:1}
.tiles{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:150px;gap:12px;align-content:start}
.tile{background:#2b2d31;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;transition:box-shadow .12s;animation:fade .2s}
.tile.speak{box-shadow:inset 0 0 0 3px #23a55a}
.tn{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:4px;font-size:13px;color:#fff}
.ti{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;align-items:center}
.ti .sl{background:rgba(0,0,0,.6);padding:3px;border-radius:50%}.ti .sl::after{left:3px;right:3px}
.vctl{display:flex;justify-content:center;gap:12px;padding:14px;flex-shrink:0}
.cb{width:48px;height:48px;border-radius:50%;background:#2b2d31;color:#dbdee1;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.cb:hover{background:#383a40}.cb.off{background:#3b2425;color:#f23f42}.cb.off::after{content:"";position:absolute;left:13px;right:13px;top:50%;height:2px;background:#f23f42;transform:rotate(-45deg)}
.cb.act{background:#23a55a;color:#fff}.cb.red{background:#da373c;color:#fff}.cb.red:hover{background:#a12828}
button{padding:8px 16px;border-radius:4px;border:0;background:#5865F2;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
button:hover{background:#4752c4}button.red{background:#da373c}button.red:hover{background:#a12828}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;justify-content:center;align-items:center}
.box{background:#313338;border-radius:8px;padding:24px;width:100%;max-width:440px}
.box h3{color:#f2f3f5;font-size:20px;margin-bottom:12px}.box p{color:#b5bac1;font-size:14px;margin-bottom:16px}
.box label{display:block;font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase;margin:12px 0 6px}
.box input,.box select{width:100%;padding:10px;border-radius:4px;border:0;background:#1e1f22;color:#dbdee1;font-size:15px;outline:0}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.acts .g{background:none}.acts .g:hover{text-decoration:underline;background:none}
.toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#111214;color:#f2f3f5;padding:10px 14px;border-radius:6px;border-left:4px solid #5865F2;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.5);animation:slide .25s;transition:opacity .3s}
.toast.join{border-color:#23a55a}.toast.leave{border-color:#ed4245}.toast.live{border-color:#a259ff}
.tb{display:none;position:absolute;right:16px;top:-14px;background:#313338;border:1px solid #232428;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.msg:hover .tb{display:flex}.tb button{background:none;padding:4px 6px;font-size:16px}.tb button:hover{background:#3f4147}
.rxs{display:flex;flex-wrap:wrap}
.rx{background:#2b2d31;border:1px solid transparent;padding:2px 8px;border-radius:8px;font-size:14px;margin:4px 4px 0 0;color:#dbdee1}
.rx:hover{background:#35373c}.rx.mine{background:#3b405a;border-color:#5865F2}
.fl{position:fixed;bottom:90px;font-size:28px;pointer-events:none;z-index:150;animation:rise 1.6s ease-out forwards}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(237,66,69,.7)}50%{box-shadow:0 0 0 5px rgba(237,66,69,0)}}
@keyframes rise{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-55vh) scale(1.6);opacity:0}}
@keyframes pop{50%{transform:scale(1.25)}}
@media(max-width:900px){.members{display:none}.rail{display:none}}
</style>
</head>
<body>
<div id="audioBox" style="display:none"></div>
<div class="toasts" id="toasts"></div>

<div class="ov" id="mCreate"><div class="box"><h3>Kanal Oluştur</h3>
<label>Kanal Türü</label><select id="newType"><option value="text"># Metin Kanalı</option><option value="voice">Ses Kanalı</option></select>
<label>Kanal Adı</label><input id="newName" maxlength="24" placeholder="yeni-kanal">
<div class="acts"><button class="g" onclick="closeM('mCreate')">İptal</button><button id="btnCreate">Oluştur</button></div></div></div>

<div class="ov" id="mStream"><div class="box"><h3>Ekran Yayını</h3><p>Yayın kalitesini seç. Yüksek ayarlar daha fazla internet ve işlemci kullanır.</p>
<label>Çözünürlük</label><select id="resSel"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option><option value="2160">4K</option></select>
<label>Kare Hızı</label><select id="fpsSel"><option value="30">30 FPS</option><option value="60" selected>60 FPS</option></select>
<div class="acts"><button class="g" onclick="closeM('mStream')">İptal</button><button id="btnGo">Yayına Başla</button></div></div></div>

<div class="ov" id="mInfo"><div class="box"><h3 id="infoT"></h3><p id="infoD"></p><div class="acts"><button onclick="closeM('mInfo')">Tamam</button></div></div></div>

<div class="app">
<div class="rail"><div class="srv">LL</div></div>
<div class="side">
  <div class="sh">LumoLive</div>
  <div class="chs">
    <div class="cat"><span>Metin Kanalları</span><button onclick="openCreate('text')" title="Metin Kanalı Oluştur">+</button></div><div id="tList"></div>
    <div class="cat"><span>Ses Kanalları</span><button onclick="openCreate('voice')" title="Ses Kanalı Oluştur">+</button></div><div id="vList"></div>
  </div>
  <div class="vstat" id="vstat"><div><b>Ses Bağlandı</b><small id="vstatName"></small></div>
    <button class="ib" onclick="leaveVoice()" title="Bağlantıyı Kes"><i data-ic="hang"></i></button></div>
  <div class="panel">
    <div class="me"><div class="av" id="meAv"></div><div><b id="meName"></b><small id="meSt">Bağlanıyor...</small></div></div>
    <div style="display:flex">
      <button class="ib" id="btnMic" title="Mikrofon"><i data-ic="mic"></i></button>
      <button class="ib" id="btnDeaf" title="Sağırlaştır"><i data-ic="head"></i></button>
      <button class="ib" id="btnSnd" title="Bildirim Sesleri"><i data-ic="bell"></i></button>
      <button class="ib" onclick="logout()" title="Çıkış Yap"><i data-ic="out"></i></button>
    </div>
  </div>
</div>

<div class="main">
  <div class="hd"><div class="t"><i id="titleIc"></i><span id="title"></span></div></div>
  <div class="body">
    <div id="textView">
      <div class="center"><div class="msgs" id="msgs"></div>
        <div class="inp"><input id="chatIn" maxlength="500" autocomplete="off" placeholder="Mesaj gönder"></div></div>
      <div class="members"><h4>Çevrimiçi — <span id="cnt">0</span></h4><div id="mList"></div></div>
    </div>
    <div id="voiceView">
      <div id="stage"><video id="vid" autoplay playsinline></video>
        <div class="bar"><span id="who"></span><span><button onclick="fsc()">Tam Ekran</button> <button class="red" id="btnStop" style="display:none" onclick="stopStream()">Yayını Durdur</button></span></div></div>
      <div class="tiles" id="tiles"></div>
      <div class="vctl">
        <button class="cb" id="cMic" title="Mikrofon"><i data-ic="mic"></i></button>
        <button class="cb" id="cDeaf" title="Sağırlaştır"><i data-ic="head"></i></button>
        <button class="cb" id="btnShare" title="Ekran Paylaş"><i data-ic="share"></i></button>
        <button class="cb red" onclick="leaveVoice()" title="Bağlantıyı Kes"><i data-ic="hang"></i></button>
      </div>
    </div>
  </div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const user = localStorage.getItem('lumolive_user'), token = localStorage.getItem('lumolive_token');
if (!user || !token) location.replace('/login.html');
const $ = id => document.getElementById(id);
const openM = id => $(id).style.display = 'flex', closeM = id => $(id).style.display = 'none';
const info = (t, d) => { $('infoT').textContent = t; $('infoD').textContent = d; openM('mInfo'); };
const color = n => `hsl(${[...n].reduce((a, c) => a + c.charCodeAt(0) * 7, 0) % 360},55%,45%)`;
function avatar(n, cls) { const d = document.createElement('div'); d.className = 'av ' + (cls || ''); d.style.background = color(n); d.textContent = n[0].toUpperCase(); return d; }
const hhmm = t => new Date(t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

const IC = {
  mic: 'M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z',
  head: 'M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5v-1a7 7 0 0 1 14 0v1h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z',
  share: 'M21 3H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h7v2H8v2h8v-2h-2v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 13H3V5h18v11z',
  out: 'M10 17l1.4-1.4-2.6-2.6H20v-2H8.8l2.6-2.6L10 7l-5 5 5 5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4V5z',
  bell: 'M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z',
  hash: 'M5.9 21l.9-4H3l.4-2h3.8l1-4H4.4l.4-2h3.8l.9-4h2l-.9 4h4l.9-4h2l-.9 4H20l-.4 2h-3.8l-1 4h3.8l-.4 2h-3.8l-.9 4h-2l.9-4h-4l-.9 4h-2zm4.3-6h4l1-4h-4l-1 4z',
  spk: 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z',
  hang: 'M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85a.99.99 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z'
};
const svg = n => `<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = svg(e.dataset.ic));
$('meName').textContent = user; $('meAv').style.background = color(user); $('meAv').textContent = user[0].toUpperCase();
function logout() { if (voiceId) socket.emit('leave-room'); localStorage.removeItem('lumolive_user'); localStorage.removeItem('lumolive_token'); location.href = '/login.html'; }

// ----- Durum -----
let chans = { text: [], voice: [] }, view = 'text', textId = '', voiceId = '', voiceMembers = [], hostSid = null;
let micStream = null, micOn = true, deaf = false, preMic = true, isHost = false, screen = null;
let soundOn = localStorage.getItem('lumolive_sound') !== '0', ac = null, names = {};
const voice = {}, hostPCs = {}, watchers = {};
let viewPC = null;
const rtc = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };
// Farklı ağlardaki kullanıcılar için kendi TURN sunucunu ekle:
// rtc.iceServers.push({ urls: 'turn:SUNUCU:3478', username: '...', credential: '...' });

const socket = io({ auth: { token } });
socket.on('connect_error', e => { if (e.message === 'unauthorized') logout(); else $('meSt').textContent = 'Bağlantı yok'; });
socket.on('disconnect', () => { $('meSt').textContent = 'Bağlantı koptu...'; cleanup(); });
socket.on('connect', () => { $('meSt').textContent = 'Bağlandı'; if (textId) socket.emit('join-text', { channelId: textId }); if (voiceId) joinVoice(voiceId); });

// ----- Sesler -----
const getAC = () => ac = ac || new (window.AudioContext || window.webkitAudioContext)();
document.addEventListener('click', () => { try { getAC().state === 'suspended' && ac.resume(); } catch {} });
const SND = { join: [[523, .1], [784, .16]], leave: [[784, .1], [494, .16]], mute: [[420, .08], [300, .12]], unmute: [[300, .08], [440, .12]],
  deaf: [[350, .08], [250, .08], [180, .14]], undeaf: [[180, .08], [250, .08], [350, .14]], msg: [[880, .06], [1040, .08]],
  live: [[523, .08], [659, .08], [784, .16]], end: [[784, .08], [587, .08], [392, .16]], err: [[220, .12], [180, .18]], react: [[1100, .05]] };
function play(k) {
  if (!soundOn) return;
  try {
    const c = getAC(); if (c.state === 'suspended') c.resume(); let t = c.currentTime;
    SND[k].forEach(([f, d]) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d); t += d * .75; });
  } catch {}
}
function toast(t, k) { const d = document.createElement('div'); d.className = 'toast ' + (k || ''); d.textContent = t; $('toasts').appendChild(d);
  setTimeout(() => { d.style.opacity = 0; setTimeout(() => d.remove(), 300); }, 3000); }
$('btnSnd').classList.toggle('off', !soundOn);
$('btnSnd').onclick = () => { soundOn = !soundOn; localStorage.setItem('lumolive_sound', soundOn ? '1' : '0'); $('btnSnd').classList.toggle('off', !soundOn); play('unmute'); };
const setNames = ms => { names = {}; ms.forEach(m => names[m.id] = m.username); };

// ----- Konuşma göstergesi (yeşil halka) -----
function unwatch(k) { const w = watchers[k]; if (w) { try { w.src.disconnect(); } catch {} delete watchers[k]; } }
function watch(k, stream) {
  unwatch(k); if (!stream.getAudioTracks().length) return;
  try { const c = getAC(), an = c.createAnalyser(); an.fftSize = 512; const src = c.createMediaStreamSource(stream); src.connect(an);
    watchers[k] = { an, src, buf: new Uint8Array(an.fftSize) }; } catch {}
}
setInterval(() => {
  for (const k in watchers) {
    const w = watchers[k]; w.an.getByteTimeDomainData(w.buf); let m = 0; for (const v of w.buf) m = Math.max(m, Math.abs(v - 128));
    const on = m > 12 && (k !== 'me' || (micOn && !deaf && voiceId)), sid = k === 'me' ? socket.id : k;
    document.querySelectorAll(`[data-sid="${sid}"]`).forEach(e => e.classList.toggle('speak', on));
  }
}, 100);

// ----- Mikrofon / Sağırlaştırma -----
const micReady = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
  .then(s => { micStream = s; watch('me', s); syncBtns(); }).catch(() => syncBtns());
const vs = () => socket.emit('voice-state', { muted: !micStream || !micOn, deaf });
function syncBtns() {
  ['btnMic', 'cMic'].forEach(i => $(i).classList.toggle('off', !micStream || !micOn));
  ['btnDeaf', 'cDeaf'].forEach(i => $(i).classList.toggle('off', deaf));
}
function setMic(on) { micOn = on; if (micStream) micStream.getAudioTracks().forEach(t => t.enabled = on); }
function setDeaf(d) { deaf = d; document.querySelectorAll('#audioBox audio').forEach(a => a.muted = d); if (!isHost) $('vid').muted = d; }
function toggleMic() {
  if (!micStream) return info('Mikrofon yok', 'Mikrofon izni verilmedi veya mikrofon bulunamadı. Tarayıcı adres çubuğundan izin verip sayfayı yenile.');
  if (deaf) { setDeaf(false); setMic(true); } else setMic(!micOn);
  syncBtns(); vs(); play(micOn ? 'unmute' : 'mute');
}
function toggleDeaf() {
  if (!deaf) { preMic = micOn; setDeaf(true); setMic(false); } else { setDeaf(false); setMic(preMic); }
  syncBtns(); vs(); play(deaf ? 'deaf' : 'undeaf');
}
$('btnMic').onclick = $('cMic').onclick = toggleMic;
$('btnDeaf').onclick = $('cDeaf').onclick = toggleDeaf;

// ----- Kanal listesi -----
function row(ic, name, on) {
  const d = document.createElement('div'); d.className = 'ch' + (on ? ' on' : '');
  d.innerHTML = svg(ic) + '<span class="n"></span>'; d.querySelector('.n').textContent = name; return d;
}
function renderChannels() {
  const t = $('tList'); t.innerHTML = '';
  chans.text.forEach(id => { const r = row('hash', id, view === 'text' && textId === id); r.onclick = () => selectText(id); t.appendChild(r); });
  const v = $('vList'); v.innerHTML = '';
  chans.voice.forEach(r => {
    const el = row('spk', r.id, view === 'voice' && voiceId === r.id); el.onclick = () => openVoice(r.id); v.appendChild(el);
    r.members.forEach(m => {
      const u = document.createElement('div'); u.className = 'vu';
      const av = avatar(m.username); av.dataset.sid = m.id; u.appendChild(av);
      const n = document.createElement('span'); n.className = 'n'; n.textContent = m.username; u.appendChild(n);
      const ic = document.createElement('span'); ic.style.cssText = 'display:flex;gap:4px;align-items:center';
      if (r.isLive && r.hostName === m.username) ic.innerHTML += '<span class="live">CANLI</span>';
      if (m.deaf) ic.innerHTML += `<span class="sl">${svg('head')}</span>`; else if (m.muted) ic.innerHTML += `<span class="sl">${svg('mic')}</span>`;
      u.appendChild(ic); v.appendChild(u);
    });
  });
}
socket.on('room-list-update', list => { chans = list; renderChannels(); if (!textId && list.text.length) selectText(list.text[0]); });
socket.on('online-list', l => {
  $('cnt').textContent = l.length; const c = $('mList'); c.innerHTML = '';
  l.forEach(n => { const d = document.createElement('div'); d.className = 'mi'; d.appendChild(avatar(n)); const s = document.createElement('span'); s.textContent = n; d.appendChild(s); c.appendChild(d); });
});

function openCreate(type) { $('newType').value = type; openM('mCreate'); $('newName').focus(); }
$('btnCreate').onclick = () => { const v = $('newName').value.trim(); if (!v) return; socket.emit('create-channel', { roomName: v, type: $('newType').value }); closeM('mCreate'); $('newName').value = ''; };
$('newName').onkeydown = e => { if (e.key === 'Enter') $('btnCreate').click(); };
socket.on('channel-created', ({ type, id }) => type === 'text' ? selectText(id) : openVoice(id));

function setView(v) {
  view = v; $('textView').style.display = v === 'text' ? 'flex' : 'none'; $('voiceView').style.display = v === 'voice' ? 'flex' : 'none';
  $('title').textContent = v === 'text' ? textId : voiceId; $('titleIc').innerHTML = svg(v === 'text' ? 'hash' : 'spk'); renderChannels();
}

// ----- Metin kanalı -----
function selectText(id) { textId = id; $('msgs').innerHTML = ''; socket.emit('join-text', { channelId: id }); setView('text'); }
socket.on('text-joined', ({ channelId, messages }) => {
  if (channelId !== textId) return;
  $('msgs').innerHTML = ''; messages.forEach(addMsg);
  if (!messages.length) $('msgs').innerHTML = `<div class="empty"><h2>#${channelId} kanalına hoş geldin!</h2>Burası bu kanalın başlangıcı.</div>`;
});
const EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🔥'];
function toolbar(id) { const t = document.createElement('div'); t.className = 'tb';
  EMOJIS.forEach(e => { const b = document.createElement('button'); b.textContent = e; b.onclick = () => socket.emit('react', { msgId: id, emoji: e }); t.appendChild(b); }); return t; }
function renderRx(box, rx) { box.innerHTML = '';
  for (const e in rx) { const u = rx[e]; if (!u.length) continue; const b = document.createElement('button'); b.className = 'rx' + (u.includes(user) ? ' mine' : '');
    b.title = u.join(', '); b.textContent = e + ' ' + u.length; b.onclick = () => socket.emit('react', { msgId: box.closest('.msg').dataset.id, emoji: e }); box.appendChild(b); } }
function floatEmoji(e) { const d = document.createElement('div'); d.className = 'fl'; d.textContent = e; d.style.left = (30 + Math.random() * 40) + 'vw'; document.body.appendChild(d); setTimeout(() => d.remove(), 1600); }
function addMsg(m) {
  const e = $('msgs').querySelector('.empty'); if (e) e.remove();
  const d = document.createElement('div'); d.className = 'msg'; d.dataset.id = m.id; d.appendChild(avatar(m.username));
  const c = document.createElement('div'), h = document.createElement('div');
  const b = document.createElement('b'); b.textContent = m.username; b.style.color = color(m.username).replace('45%', '70%');
  const t = document.createElement('time'); t.textContent = hhmm(m.time); h.append(b, t);
  const p = document.createElement('p'); p.textContent = m.text;
  const rx = document.createElement('div'); rx.className = 'rxs'; renderRx(rx, m.reactions || {});
  c.append(h, p, rx); d.append(c, toolbar(m.id));
  const box = $('msgs'), bottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.appendChild(d); if (bottom) box.scrollTop = box.scrollHeight;
}
socket.on('chat-message', m => { addMsg(m); if (m.username !== user) play('msg'); });
socket.on('reaction-update', ({ msgId, reactions, emoji, added }) => {
  const m = document.querySelector(`.msg[data-id="${msgId}"]`); if (m) renderRx(m.querySelector('.rxs'), reactions);
  if (added) { floatEmoji(emoji); play('react'); }
});
$('chatIn').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) { socket.emit('chat-message', { text: e.target.value }); e.target.value = ''; } };

// ----- Ses kanalı -----
function cleanup() {
  Object.values(voice).forEach(p => p.close()); Object.keys(voice).forEach(k => delete voice[k]);
  Object.values(hostPCs).forEach(p => p.close()); Object.keys(hostPCs).forEach(k => delete hostPCs[k]);
  if (viewPC) { viewPC.close(); viewPC = null; }
  Object.keys(watchers).forEach(k => k !== 'me' && unwatch(k));
  $('audioBox').innerHTML = ''; if (!isHost) $('vid').srcObject = null;
}
async function joinVoice(id) {
  if (isHost) stopStream(); cleanup(); await micReady; voiceId = id;
  socket.emit('join-room', { roomId: id });
}
function openVoice(id) { if (voiceId !== id) joinVoice(id); setView('voice'); }
function leaveVoice() {
  if (!voiceId) return; if (isHost) stopStream();
  socket.emit('leave-room'); voiceId = ''; voiceMembers = []; hostSid = null; cleanup(); play('leave');
  $('vstat').style.display = 'none'; setView('text');
}
function showStage(on) { $('stage').style.display = on ? 'block' : 'none'; }
function renderVoice() {
  const g = $('tiles'); g.innerHTML = '';
  voiceMembers.forEach(m => {
    const t = document.createElement('div'); t.className = 'tile'; t.dataset.sid = m.id;
    const av = avatar(m.username, 'big'); av.dataset.sid = m.id; t.appendChild(av);
    const n = document.createElement('div'); n.className = 'tn'; n.textContent = m.username; t.appendChild(n);
    const ic = document.createElement('div'); ic.className = 'ti';
    ic.innerHTML = (m.id === hostSid ? '<span class="live">CANLI</span>' : '') + (m.deaf ? `<span class="sl">${svg('head')}</span>` : m.muted ? `<span class="sl">${svg('mic')}</span>` : '');
    t.appendChild(ic); g.appendChild(t);
  });
}
socket.on('room-joined', async ({ roomId, isLive, hostName, hostSocketId, members }) => {
  setNames(members); voiceMembers = members; hostSid = isLive ? hostSocketId : null;
  $('vstat').style.display = 'flex';$('vstatName').textContent = roomId;
  showStage(isLive); $('who').textContent = isLive ? `${hostName} yayında` : '';
  renderVoice(); syncBtns(); vs(); play('join');
  // Odaya katılan kişinin odadaki diğer mevcut kullanıcılara bağlantı (offer) göndermesi:
  for (const m of members) {
    if (m.id === socket.id) continue;
    if (voice[m.id]) voice[m.id].close();
    const pc = voice[m.id] = voicePC(m.id);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('signal', { target: m.id, signal: { sdp: pc.localDescription }, type: 'voice' });
  }
});
socket.on('update-room-members', ms => { setNames(ms); voiceMembers = ms; renderVoice(); });

function flush(pc) { (pc._q || []).forEach(c => pc.addIceCandidate(c).catch(() => {})); pc._q = []; }
function addCand(pc, c) { if (pc.remoteDescription) pc.addIceCandidate(c).catch(() => {}); else (pc._q = pc._q || []).push(c); }
function voicePC(id) {
  const pc = new RTCPeerConnection(rtc);
  pc.onicecandidate = e => e.candidate && socket.emit('signal', { target: id, signal: { candidate: e.candidate }, type: 'voice' });
  pc.ontrack = e => {
    let a = $('a-' + id);
    if (!a) { a = document.createElement('audio'); a.id = 'a-' + id; a.autoplay = true; $('audioBox').appendChild(a); }
    a.muted = deaf; a.srcObject = e.streams[0]; watch(id, e.streams[0]); a.play().catch(() => {});
  };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') pc.restartIce(); };
  if (micStream) micStream.getTracks().forEach(t => pc.addTrack(t, micStream)); else pc.addTransceiver('audio', { direction: 'recvonly' });
  return pc;
}
socket.on('user-joined-voice', async ({ socketId, username }) => {
  play('join'); toast(`${username} ses kanalına katıldı`, 'join');
  if (voice[socketId]) voice[socketId].close();
  const pc = voice[socketId] = voicePC(socketId);
  await pc.setLocalDescription(await pc.createOffer());
  socket.emit('signal', { target: socketId, signal: { sdp: pc.localDescription }, type: 'voice' });
});
socket.on('user-left-voice', id => {
  if (names[id]) { play('leave'); toast(`${names[id]} ses kanalından ayrıldı`, 'leave'); }
  unwatch(id);
  if (voice[id]) { voice[id].close(); delete voice[id]; }
  if (hostPCs[id]) { hostPCs[id].close(); delete hostPCs[id]; }
  const a = $('a-' + id); if (a) a.remove();
});

// ----- Ekran yayını -----
$('btnShare').onclick = () => isHost ? info('Yayındasın', 'Zaten ekran paylaşıyorsun.') : voiceId ? openM('mStream') : 0;
const BITRATE = { 720: 4e6, 1080: 8e6, 1440: 14e6, 2160: 25e6 };
$('btnGo').onclick = async () => {
  const h = +$('resSel').value, fps = +$('fpsSel').value;
  try {
    screen = await navigator.mediaDevices.getDisplayMedia({ video: { width: { ideal: h * 16 / 9 }, height: { ideal: h }, frameRate: { ideal: fps, max: fps } }, audio: true });
  } catch { return info('İzin Hatası', 'Ekran paylaşımı başlatılamadı veya iptal edildi.'); }
  closeM('mStream'); isHost = true; screen._bitrate = BITRATE[h];
  const vt = screen.getVideoTracks()[0]; vt.contentHint = 'motion'; vt.onended = stopStream;
  $('vid').srcObject = screen; $('vid').muted = true; showStage(true);
  $('who').textContent = 'Yayıncı sensin'; $('btnStop').style.display = 'inline-block'; $('btnShare').classList.add('act');
  play('live'); toast('Yayın başladı', 'live');
  socket.emit('start-stream-in-room');
};
socket.on('viewer-wants-stream', async ({ viewerId }) => {
  if (!isHost || !screen) return;
  if (hostPCs[viewerId]) hostPCs[viewerId].close();
  const pc = hostPCs[viewerId] = new RTCPeerConnection(rtc);
  pc.onicecandidate = e => e.candidate && socket.emit('signal', { target: viewerId, signal: { candidate: e.candidate }, type: 'stream' });
  screen.getTracks().forEach(t => pc.addTrack(t, screen));
  try {
    const s = pc.getSenders().find(s => s.track && s.track.kind === 'video'), p = s.getParameters();
    p.encodings = p.encodings && p.encodings.length ? p.encodings : [{}];
    p.encodings[0].maxBitrate = screen._bitrate; await s.setParameters(p);
  } catch {}
  await pc.setLocalDescription(await pc.createOffer());
  socket.emit('signal', { target: viewerId, signal: { sdp: pc.localDescription }, type: 'stream' });
});
function stopStream() {
  if (!isHost) return;
  if (screen) { screen.getTracks().forEach(t => { t.onended = null; t.stop(); }); screen = null; }
  Object.values(hostPCs).forEach(p => p.close()); Object.keys(hostPCs).forEach(k => delete hostPCs[k]);
  isHost = false; $('vid').srcObject = null; $('btnStop').style.display = 'none'; $('btnShare').classList.remove('act'); showStage(false);
  socket.emit('stop-stream');
}
socket.on('stream-started', ({ roomId, hostName, hostSocketId }) => {
  hostSid = hostSocketId; renderVoice();
  if (roomId !== voiceId || isHost) return;
  if (viewPC) { viewPC.close(); viewPC = null; }
  showStage(true); $('who').textContent = `${hostName} yayında`;
  play('live'); toast(`${hostName} yayın başlattı`, 'live');
});
socket.on('room-stream-ended', () => {
  play('end'); toast('Yayın sona erdi', 'leave'); hostSid = null; renderVoice();
  if (viewPC) { viewPC.close(); viewPC = null; }
  if (!isHost) { $('vid').srcObject = null; showStage(false); }
});

socket.on('signal', async ({ sender, signal, type }) => {
  try {
    if (type === 'voice') {
      let pc = voice[sender]; if (!pc) pc = voice[sender] = voicePC(sender);
      if (signal.sdp) {
        await pc.setRemoteDescription(signal.sdp); flush(pc);
        if (signal.sdp.type === 'offer') { await pc.setLocalDescription(await pc.createAnswer()); socket.emit('signal', { target: sender, signal: { sdp: pc.localDescription }, type: 'voice' }); }
      } else if (signal.candidate) addCand(pc, signal.candidate);
    } else if (type === 'stream') {
      if (isHost) {
        const pc = hostPCs[sender]; if (!pc) return;
        if (signal.sdp) { await pc.setRemoteDescription(signal.sdp); flush(pc); } else if (signal.candidate) addCand(pc, signal.candidate);
      } else {
        if (!viewPC) {
          viewPC = new RTCPeerConnection(rtc);
          viewPC.onicecandidate = e => e.candidate && socket.emit('signal', { target: sender, signal: { candidate: e.candidate }, type: 'stream' });
          viewPC.ontrack = e => {
            const v = $('vid'); v.srcObject = e.streams[0]; v.muted = deaf;
            v.play().catch(() => { v.muted = true; v.play(); info('Ses kapalı', 'Tarayıcı otomatik sesi engelledi. Videoya tıklayıp sesi açabilirsin.'); });
          };
        }
        if (signal.sdp) {
          await viewPC.setRemoteDescription(signal.sdp); flush(viewPC);
          if (signal.sdp.type === 'offer') { await viewPC.setLocalDescription(await viewPC.createAnswer()); socket.emit('signal', { target: sender, signal: { sdp: viewPC.localDescription }, type: 'stream' }); }
        } else if (signal.candidate) addCand(viewPC, signal.candidate);
      }
    }
  } catch (e) { console.warn('signal hatası', e); }
});

socket.on('error-msg', m => { play('err'); info('Hata', m); });
$('vid').onclick = e => { if (!isHost) { e.target.muted = false; e.target.play(); } };
function fsc() { const s = $('stage'); document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen(); }
window.addEventListener('beforeunload', () => socket.emit('leave-room'));
setView('text'); syncBtns();
</script>
</body>
</html>
