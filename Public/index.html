<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - Uzaktan Masaüstü & Yayın</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 1000px; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* Login Ekranı */
        #login-screen { text-align: center; padding: 40px 20px; }
        .input-group { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        input[type="text"] { padding: 12px 16px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
        button { padding: 12px 24px; border-radius: 6px; border: none; background: #3b82f6; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }

        /* Ana Panel */
        #main-panel { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        
        /* Sekmeler (Tabs) */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #334155; color: #94a3b8; }
        .tab-btn.active { background: #3b82f6; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Yayın Listesi Kartları */
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .room-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .room-card h3 { font-size: 18px; margin-bottom: 5px; color: #38bdf8; }
        .room-card p { font-size: 14px; color: #94a3b8; margin-bottom: 15px; }

        /* Canlı Yayın Alanı */
        .stream-layout { display: grid; grid-template-columns: 3fr 1fr; gap: 15px; margin-top: 20px; }
        #video-container { background: #000; border-radius: 8px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; display: block; }
        
        /* İzleyici Listesi Paneli */
        .viewers-panel { background: #0f172a; border-radius: 8px; padding: 15px; border: 1px solid #334155; }
        .viewers-panel h4 { border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 10px; color: #38bdf8; }
        .viewer-list { list-style: none; }
        .viewer-item { padding: 6px 10px; background: #1e293b; margin-bottom: 5px; border-radius: 4px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. ADIM: KULLANICI GİRİŞ EKRANI -->
        <div id="login-screen">
            <h1>StreamHub'a Hoş Geldiniz</h1>
            <p style="color: #94a3b8; margin-top: 8px;">Devam etmek için bir kullanıcı adı belirleyin</p>
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Kullanıcı Adınız...">
                <button id="loginBtn">Giriş Yap</button>
            </div>
        </div>

        <!-- 2. ADIM: ANA KONTROL PANELİ -->
        <div id="main-panel">
            <div class="header">
                <h2>Uzaktan Masaüstü & Yayın</h2>
                <span id="userBadge" style="background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 14px;"></span>
            </div>

            <!-- Sekme Butonları -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('list-tab')">Yayınları Listele</button>
                <button class="tab-btn" onclick="switchTab('host-tab')">Yayın Aç</button>
            </div>

            <!-- TAB 1: Yayınları Listeleme -->
            <div id="list-tab" class="tab-content active">
                <div class="room-grid" id="roomGrid">
                    <!-- Aktif yayın kartları JS ile buraya eklenecek -->
                </div>
            </div>

            <!-- TAB 2: Yayın Açma -->
            <div id="host-tab" class="tab-content">
                <div class="input-group" style="justify-content: flex-start; margin-bottom: 20px;">
                    <input type="text" id="roomNameInput" placeholder="Oda / Yayın Adı Girin...">
                    <button id="startHostBtn">Yayını Başlat</button>
                </div>
            </div>

            <!-- CANLI YAYIN PENCERESİ VE İZLEYİCİ PANELİ -->
            <div id="stream-section" style="display: none;" class="stream-layout">
                <div id="video-container">
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
                <div class="viewers-panel">
                    <h4>İzleyiciler (<span id="viewerCount">0</span>)</h4>
                    <ul class="viewer-list" id="viewerList">
                        <!-- İzleyiciler burada listelenecek -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let currentUser = "";
        let currentRoomId = "";
        let localStream = null;
        let peerConnection = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // GİRİŞ MANTIĞI
        document.getElementById('loginBtn').addEventListener('click', () => {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) return alert("Lütfen geçerli bir kullanıcı adı girin!");
            
            currentUser = username;
            document.getElementById('userBadge').innerText = `👤 ${currentUser}`;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
        });

        // SEKMELER ARASI GEÇİŞ
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // ODA LİSTESİNİ GÜNCELLEME
        socket.on('room-list', (rooms) => {
            const grid = document.getElementById('roomGrid');
            grid.innerHTML = "";

            if (rooms.length === 0) {
                grid.innerHTML = `<p style="color:#94a3b8;">Şu anda aktif bir yayın bulunmuyor.</p>`;
                return;
            }

            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.innerHTML = `
                    <div>
                        <h3>${room.id}</h3>
                        <p>Yayıncı: <b>${room.hostName}</b></p>
                        <p>İzleyici: ${room.viewerCount} Kişi</p>
                    </div>
                    <button onclick="joinStream('${room.id}')">Yayına Katıl</button>
                `;
                grid.appendChild(card);
            });
        });

        // YAYIN BAŞLATMA (HOST)
        document.getElementById('startHostBtn').addEventListener('click', async () => {
            const roomName = document.getElementById('roomNameInput').value.trim();
            if (!roomName) return alert("Lütfen bir oda adı girin!");

            try {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: false });
                document.getElementById('remoteVideo').srcObject = localStream;
                document.getElementById('stream-section').style.display = 'grid';

                currentRoomId = roomName;
                socket.emit('create-room', { roomId: roomName, username: currentUser });

            } catch (err) {
                alert("Ekran paylaşımı başlatılamadı!");
            }
        });

        // YAYINA KATILMA (VIEWER)
        function joinStream(roomId) {
            currentRoomId = roomId;
            document.getElementById('stream-section').style.display = 'grid';
            socket.emit('join-room', { roomId, username: currentUser });
        }

        // İZLEYİCİ LİSTESİNİ GÜNCELLEME
        socket.on('update-viewers', (viewers) => {
            const list = document.getElementById('viewerList');
            document.getElementById('viewerCount').innerText = viewers.length;
            list.innerHTML = "";

            viewers.forEach(v => {
                const li = document.createElement('li');
                li.className = 'viewer-item';
                li.innerHTML = `<span class="status-dot"></span> ${v.username}`;
                list.appendChild(li);
            });
        });

        // WebRTC BAĞLANTI SİNYALLERİ
        socket.on('user-connected', async (viewerId) => {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('signal', { target: viewerId, signal: { candidate: event.candidate } });
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('signal', { target: viewerId, signal: { sdp: peerConnection.localDescription } });
        });

        socket.on('signal', async (data) => {
            if (!peerConnection) {
                peerConnection = new RTCPeerConnection(rtcConfig);
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) socket.emit('signal', { target: data.sender, signal: { candidate: event.candidate } });
                };
                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };
            }

            if (data.signal.sdp) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                if (data.signal.sdp.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('signal', { target: data.sender, signal: { sdp: peerConnection.localDescription } });
                }
            } else if (data.signal.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        socket.on('room-closed', () => {
            alert("Yayıncı yayını sonlandırdı.");
            location.reload();
        });
    </script>
</body>
</html>
