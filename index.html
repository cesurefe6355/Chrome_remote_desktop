<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tabanlı Uzaktan Erişim</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }
        # ekran-canvas {
            border: 2px solid #444;
            max-width: 100%;
            max-height: 80vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <h2>Canlı Ekran Aktarımı</h2>
    <canvas id="ekran-canvas" width="1280" height="720"></canvas>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const socket = new WebSocket(wsProtocol + window.location.host);

        const canvas = document.getElementById('ekran-canvas');
        const ctx = canvas.getContext('2d');

        socket.onmessage = function(event) {
            const blob = event.data;
            const img = new Image();
            
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(img.src);
            };
            
            img.src = URL.createObjectURL(blob);
        };

        canvas.addEventListener('mousemove', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'mouse_move', x: x, y: y }));
            }
        });

        window.addEventListener('keydown', function(e) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'key_down', key: e.key }));
            }
        });
    </script>

</body>
</html>
